.test-toolbar{position:sticky;top:0;z-index:20;background:#ececec;color:#222;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:10px;margin-bottom:12px}.test-toolbar small{font-size:11px}.test-toolbar button{min-height:44px;white-space:nowrap}.add-grocery{font-weight:700;font-size:18px;margin:4px 0 12px;min-height:48px}.list-intro{margin:12px 0 6px}.compact-actions{display:flex;gap:8px;margin:8px 0 12px}.compact-actions button{flex:1;min-width:0;padding:8px;font-size:14px;border-color:#28664F}.list-intro{font-size:14px;margin:8px 0}.banner{padding:10px 12px;margin:10px 0}.banner p{margin:4px 0;font-size:14px}.item-details{display:block;margin:3px 0}.history-qty{font-weight:600;margin:3px 0}.history-details{display:block;line-height:1.5}.history-item{align-items:flex-start}.country-combo{position:relative}.country-combo .row{gap:0}.country-combo .row input{min-width:0;border-radius:10px 0 0 10px}.country-combo .row button{border-radius:0 10px 10px 0}.item{padding:12px;margin:8px 0}.item .row button{font-size:13px;padding:8px}.item .wide{margin-top:6px}.test-toolbar{padding:4px 8px;margin-bottom:8px}h1{font-size:25px}h2{margin:10px 0} .item-main{align-items:flex-start}.item-main .grow{min-width:0;overflow-wrap:anywhere}.purchase-control{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:0 0 76px;padding:5px 3px;font-size:11px;line-height:1.2;color:#28664F;border:1px solid #cbd8d1;background:#fff;min-height:64px}.purchase-symbol{font-size:23px;font-weight:700}.purchase-control.is-purchased{background:#DCE9D6}.purchase-control:disabled{opacity:.45}.item>.panel{margin:8px 0 0}.item>.panel .actions button{min-height:44px} .qty-stepper{display:flex;align-items:stretch;gap:4px;min-width:0}.qty-stepper button{flex:0 0 44px;min-height:48px;padding:0;font-size:24px;font-weight:700;background:#DCE9D6}.qty-stepper input{flex:1;min-width:0;width:0;text-align:center;padding:4px;appearance:textfield;-moz-appearance:textfield}.qty-stepper input::-webkit-inner-spin-button,.qty-stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}select{min-height:48px;line-height:normal;padding:10px 12px}#unit,#altUnit{height:48px;min-height:48px}.compact-actions .start-shopping{background:#DCE9D6;border:2px solid #28664F;color:#25483D;font-weight:750;min-height:48px}.compact-actions .primary{min-height:48px}.purchase-control.is-purchased .purchase-symbol{background:#28664F;color:white;border-radius:50%;width:30px;height:30px;line-height:30px}.purchase-control:not(.is-purchased) .purchase-symbol{color:#52685D}.purchase-control.is-purchased{border-color:#28664F}.purchase-control{min-height:68px}</style><main id="app"></main><dialog id="modal"></dialog><div id="toast" class="toast" hidden role="status"></div><script>
const popular=()=>["Apple","Banana","Milk","Eggs","Bread","Rice","Chicken","Tomato","Potato","Onion","Water","Yogurt","Cheese","Pasta","Orange","Cucumber"].map((name,i)=>({id:i+1,name,unit:(["kg","kg","litre","piece","pack","kg","kg","kg","kg","kg","bottle","pack","pack","pack","kg","kg"])[i]}));const seed=()=>({members:['Mohammed','Heba','Youssof'],user:'Mohammed',items:[{id:1,name:'Eggs',qty:12,unit:'piece',note:'',by:'Youssof',status:'pending'},{id:2,name:'Bread',qty:2,unit:'pack',note:'',by:'Heba',status:'pending'},{id:3,name:'Rice',qty:1,unit:'kg',note:'',by:'Mohammed',status:'pending'}],history:[],alerts:[],shopper:null});let db;function initial(){return {accounts:['Mohammed','Heba','Youssof'].map(n=>({name:n,email:n.toLowerCase()+'@demo.com',password:'demo123',family:'demo'})),families:{demo:{...seed(),name:'Our Household',code:'482916',admin:'mohammed@demo.com',catalog:popular()}},session:null}}let session=null;db=initial();delete db.session;
function setSession(email){session=email;}
let s=null,account=null,authPage='welcome',joinId=null;function restore(){account=db.accounts.find(a=>a.email===session)||null;s=account&&db.families[account.family]||null;if(s)s.user=account.name;}restore();let page='list',mode=false,filter='all';const app=document.querySelector('#app'),modal=document.querySelector('#modal');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){render()}
const item=id=>s.items.find(x=>x.id===id);const uid=()=>Date.now()+Math.floor(Math.random()*1000);function notice(t){s.alerts.unshift({text:t,time:new Date().toLocaleString()});let el=document.querySelector('#toast');el.textContent=t;el.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>el.hidden=true,2600)}function go(p){if(p!=='list')mode=false;page=p;render()}function popup(html){modal.innerHTML=html;if(!modal.open)modal.showModal()}function closeModal(){modal.close()}function render(){if(!account||!s){renderAuth();return}if(s.shopper!==s.user)mode=false;let pending=s.items.filter(x=>x.status==='pending'),done=s.items.filter(x=>x.status==='purchased');let body='';if(page==='list'){body=`<header><div><small>${esc(s.name)}</small><h1>${mode?'Shopping mode':'Family shopping list'}</h1></div><button onclick="go('alerts')" aria-label="Notifications">🔔 ${s.alerts.length||''}</button></header><div class="row"><small>Using as ${esc(s.user)}</small><button onclick="go('family')">My family</button></div>${!mode?`<p class="muted list-intro">Anyone in your family can add items or shop for everyone.</p><div class="compact-actions"><button class="primary" onclick="edit()">＋ Add item</button>${!s.shopper?'<button class="start-shopping" onclick="start()">🛒 Start shopping</button>':s.shopper===s.user?'<button onclick="toggleMode()">Resume shopping</button>':''}</div>`:''}${s.shopper?`<div class="banner"><strong>${s.shopper===s.user?'You started shopping':esc(s.shopper)+' started shopping'}</strong><p>${done.length} of ${s.items.length} items purchased</p><progress max="${s.items.length||1}" value="${done.length}"></progress>${mode?'<div class="compact-actions"><button onclick="toggleMode()">Back to list</button><button class="primary" onclick="finish()">Finish shopping</button></div>':''}</div>`:''}<div class="row"><h2>${mode?'Your checklist':'Shopping list items'}</h2></div>${!mode?`<select aria-label="Filter items" onchange="filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>All items</option><option value="pending" ${filter==='pending'?'selected':''}>To buy</option><option value="unavailable" ${filter==='unavailable'?'selected':''}>Unavailable</option><option value="purchased" ${filter==='purchased'?'selected':''}>Purchased</option></select>`:''}${s.items.filter(x=>mode||filter==='all'||x.status===filter).map(x=>`<article class="item"><div class="row item-main">${mode?`<button class="purchase-control ${x.status==='purchased'?'is-purchased':''}" aria-label="${x.status==='purchased'?'Undo purchase':'Mark as purchased'}: ${esc(x.name)}" aria-pressed="${x.status==='purchased'}" onclick="toggle(${x.id})" ${x.proposal?.state==='waiting'||x.proposal?.state==='declined'&&x.status!=='purchased'?'disabled':''}><span class="purchase-symbol">${x.status==='purchased'?'✓':'○'}</span><span>${x.status==='purchased'?'Purchased · Undo':'Mark purchased'}</span></button>`:''}<div class="grow"><div class="title ${mode&&x.status==='purchased'?'done':''}">${esc(x.name)}</div><div>${x.qty} ${esc(x.unit)} · ${esc(x.note)}</div>${details(x)}<small>Added by ${esc(x.by)}</small><br><span class="tag ${x.status}">${x.status==='pending'?'To buy':x.status==='purchased'?'Purchased by '+esc(x.buyer):'Unavailable'}</span></div>${!mode&&x.status==='pending'&&!x.proposal?`<button onclick="edit(${x.id})" aria-label="Edit ${esc(x.name)}">Edit</button>`:''}${!mode&&x.status!=='purchased'?`<button class="danger" aria-label="Delete ${esc(x.name)}" onclick="removeItem(${x.id})">Delete</button>`:mode&&x.status==='unavailable'?`<button onclick="retry(${x.id})">Retry</button>`:''}</div>${proposalView(x)}${mode&&x.status!=='purchased'?`<button class="wide" onclick="unavailable(${x.id})">Report unavailable</button>${!['waiting','approved'].includes(x.proposal?.state)?`<button class="wide" onclick="alternative(${x.id})">Suggest alternative</button>`:''}`:''}</article>`).join('')||'<div class="empty">No items here. Add an item to get started.</div>'}`;}else if(page==='history'){body=`<div class="row"><h1>Purchase history</h1><button class="danger" onclick="clearHistory()" ${s.history.length?'':'disabled'}>Clear history</button></div><p class="muted">Add previous purchases to the list again.</p>${s.history.map((x,i)=>`<div class="item row history-item"><div class="grow"><strong>${esc(x.actual?.name||x.name)}</strong><div class="history-qty">${x.actual?.qty||x.qty} ${esc(x.actual?.unit||x.unit)}</div><div class="history-details">${details(x.actual||x)}${x.actual?`<small>Originally added: ${esc(x.name)} · ${x.qty} ${esc(x.unit)} · ${esc(prefText(x))}</small><br><small>Alternative purchased</small>`:''}<br><small>Purchased by ${esc(x.buyer)} · ${esc(x.date)}</small></div></div><button onclick="again(${i})">Add again</button></div>`).join('')||'<div class="empty">No completed purchases yet.</div>'}`;}else if(page==='family'){body=`<h1>${esc(s.name)}</h1><p class="muted">${s.members.length} family members</p>${s.members.map(m=>`<div class="item row"><strong>${esc(m)}</strong><small>${db.accounts.find(a=>a.family===account.family&&a.name===m)?.email===s.admin?'Admin':'Member'}${m===account.name?' · You':''}</small></div>`).join('')}<div class="panel"><h2>Invite a family member</h2><p>Share this code with someone you want to join your family.</p><h1 style="letter-spacing:5px">${esc(s.code)}</h1><button class="wide" onclick="copyCode()">Copy invitation code</button></div><button class="wide" onclick="logout()">Log out</button>${account.email===s.admin?'<button class="danger wide" onclick="deleteFamily()">Delete family</button>':'<button class="danger wide" onclick="leaveFamily()">Leave family</button>'}<div class="panel"><h2>Prototype testing</h2><p class="muted">Switch accounts on this phone to simulate another family member.</p><button class="primary wide" onclick="switchMemberDialog()" ${db.accounts.some(a=>a.family===account.family&&a!==account)?'':'disabled'}>Switch family member</button>${db.accounts.some(a=>a.family===account.family&&a!==account)?'':'<small>No other family members yet. Invite another account first.</small>'}<button class="danger wide" onclick="resetAll()">Reset prototype</button></div>`;}else{body=`<h1>Activity</h1><p class="muted">Household updates</p>${s.alerts.map(a=>`<div class="item">${esc(a.text)}<br><small>${esc(a.time)}</small></div>`).join('')||'<div class="empty">No updates yet.</div>'}<button class="wide" onclick="s.alerts=[];save()">Clear activity</button>`;}app.innerHTML=testToolbar()+body+`<nav class="nav">${[['list','☷ List'],['history','◷ History'],['family','♧ Family'],['alerts','♢ Activity']].map(([p,l])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${l}</button>`).join('')}</nav>`}
function clearHistory(){if(!s.history.length)return;popup(`<h2>Clear purchase history?</h2><p>This removes all purchase history for everyone in your family. Your shopping list, products and activity will remain unchanged.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmClearHistory()">Clear history</button></div>`)}
function confirmClearHistory(){s.history=[];notice(s.user+' cleared purchase history');closeModal();save()}
function edit(id){if(id&&(mode||item(id)?.status!=='pending'||item(id)?.proposal))return;quantityForm(id)}
function quantityForm(id){let x=item(id)||{name:'',qty:1,unit:'piece',note:''};popup(`<h2>${id?'Edit':'Add'} item</h2><form onsubmit="submitItem(event,${id||0})"><label for="productSearch">Product</label><div class="product-combo"><div class="row"><input id="productSearch" role="combobox" aria-autocomplete="list" aria-controls="productResults" aria-expanded="false" onkeydown="productKey(event)" autocomplete="off" placeholder="Select or search for a product" value="${esc(x.name)}" oninput="productChanged()" onclick="showProducts()" required><button type="button" aria-label="Toggle product dropdown" onclick="toggleProducts()">▾</button></div><input id="name" type="hidden" value="${esc(x.name)}"><div id="productResults" class="product-results" role="listbox" hidden></div></div><p id="productError" role="alert" class="muted"></p><label for="qty">Quantity</label><div class="qty-stepper"><button type="button" aria-label="Decrease quantity" onclick="stepQty('qty',-1)">−</button><input id="qty" type="number" min="0.1" max="9999" step="any" required value="${x.qty}"><button type="button" aria-label="Increase quantity" onclick="stepQty('qty',1)">+</button></div><label for="unit">Unit</label><select id="unit">${['piece','pack','litre','kg','bottle','box','g'].map(u=>`<option ${u===x.unit?'selected':''}>${u}</option>`).join('')}</select>${preferencesForm(x)}<label for="note">Notes (optional)</label><textarea id="note" maxlength="200">${esc(x.note)}</textarea><div class="actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">${id?'Save item':'Add to shopping list'}</button></div></form>`)}
function hideProducts(){let r=document.querySelector('#productResults'),i=document.querySelector('#productSearch');if(r)r.hidden=true;if(i){i.setAttribute('aria-expanded','false');i.removeAttribute('aria-activedescendant')}}
function productKey(e){let r=document.querySelector('#productResults');if(e.key==='Escape'&&!r.hidden){e.preventDefault();e.stopPropagation();hideProducts();return}if(e.key==='Tab'){hideProducts();return}if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();if(r.hidden)showProducts();let opts=[...r.querySelectorAll('button')];if(!opts.length)return;let old=opts.findIndex(b=>b.classList.contains('active'));let next=old<0?(e.key==='ArrowDown'?0:opts.length-1):(old+(e.key==='ArrowDown'?1:-1)+opts.length)%opts.length;opts.forEach((b,j)=>{b.classList.toggle('active',j===next);b.id='product-option-'+j;b.setAttribute('aria-selected',String(j===next))});e.target.setAttribute('aria-activedescendant',opts[next].id);opts[next].scrollIntoView({block:'nearest'});}else if(e.key==='Enter'&&!r.hidden){e.preventDefault();let b=r.querySelector('.active')||r.querySelector('button');if(b)b.click()}}
document.addEventListener('click',e=>{if(!e.target.closest('.product-combo'))hideProducts()});
function toggleProducts(){let r=document.querySelector('#productResults');if(r.hidden)showProducts(true);else hideProducts()}
function productChanged(){document.querySelector('#name').value='';document.querySelector('#productError').textContent='';showProducts()}
function showProducts(all=false){let q=document.querySelector('#productSearch').value.trim();let r=document.querySelector('#productResults');r.hidden=false;document.querySelector('#productSearch').setAttribute('aria-expanded','true');let matches=s.catalog.filter(p=>all||p.name.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name));r.innerHTML=matches.map(p=>`<button type="button" role="option" tabindex="-1" onclick="selectProduct(${p.id})">${esc(p.name)}</button>`).join('')+(!all&&q&&!s.catalog.some(p=>p.name.toLowerCase()===q.toLowerCase())?`<button type="button" class="create-option" role="option" tabindex="-1" onclick="createInlineProduct()">＋ Create “${esc(q)}”</button>`:'');if(!r.innerHTML)r.innerHTML='<p>No matching products</p>'}
function selectProduct(id){let p=s.catalog.find(p=>p.id===id);if(!p)return;document.querySelector('#productSearch').value=p.name;document.querySelector('#name').value=p.name;document.querySelector('#unit').value=p.unit||'piece';hideProducts();document.querySelector('#productError').textContent=''}
function createInlineProduct(){let name=document.querySelector('#productSearch').value.trim();if(!name)return;let p=s.catalog.find(p=>p.name.toLowerCase()===name.toLowerCase());if(!p){p={id:uid(),name,unit:document.querySelector('#unit').value};s.catalog.push(p);notice(s.user+' created product '+name)}selectProduct(p.id)}
let draft;function submitItem(e,id){e.preventDefault();if(!validCountry())return;let n=document.querySelector('#name').value.trim();if(!n){document.querySelector('#productError').textContent='Select an existing product or create a new one first.';showProducts();return}let product=s.catalog.find(p=>p.name.toLowerCase()===n.toLowerCase());if(product)product.unit=document.querySelector('#unit').value;draft={name:n,productId:s.catalog.find(p=>p.name.toLowerCase()===n.toLowerCase())?.id,qty:Number(document.querySelector('#qty').value),unit:document.querySelector('#unit').value,note:document.querySelector('#note').value.trim(),by:s.user,requester:account.email,prefs:readPrefs(),status:'pending',id:uid()};if(id){let x=item(id);if(!x||x.status!=='pending'||x.proposal)return;Object.assign(x,{name:draft.name,productId:draft.productId,qty:draft.qty,unit:draft.unit,note:draft.note,prefs:draft.prefs});notice(s.user+' edited '+x.name);closeModal();save();return}checkDuplicate()}
function checkDuplicate(){let d=s.items.find(x=>x.status==='pending'&&x.name.toLowerCase()===draft.name.toLowerCase()&&x.unit===draft.unit&&prefsEqual(x,draft)&&!x.proposal&&x.requester===draft.requester);if(d){popup(`<h2>Item already on the list</h2><p>${esc(d.by)} added ${d.qty} ${esc(d.unit)} of ${esc(d.name)}. You are adding ${draft.qty} ${esc(draft.unit)}.</p>${d.unit===draft.unit?`<button class="primary wide" onclick="merge(${d.id})">Combine quantities (${d.qty+draft.qty} ${esc(d.unit)})</button>`:'<p>Different units cannot be combined.</p>'}<button class="wide" onclick="keep()">Keep separate items</button><button class="wide" onclick="closeModal()">Cancel</button>`)}else keep()}
function merge(id){let x=item(id);x.qty+=draft.qty;if(draft.note)x.note=[x.note,draft.note].filter(Boolean).join('; ');if(!x.by.split(', ').includes(s.user))x.by+=', '+s.user;notice(s.user+' updated quantity of '+x.name);closeModal();save()}function keep(){s.items.push(draft);notice(s.user+' added '+draft.name);closeModal();save()}function toggle(id){if(!mode||s.shopper!==s.user)return;let x=item(id);if(x.status==='purchased'){x.status='pending';delete x.buyer;delete x.purchasedAt}else{x.status='purchased';x.buyer=s.user;x.purchasedAt=new Date().toISOString()}notice(s.user+' marked '+x.name+' as '+x.status);save()}function unavailable(id){if(!mode||s.shopper!==s.user)return;let x=item(id);popup(`<h2>Report unavailable</h2><p>${esc(x.name)} is not available.</p><label for="alt">Suggested alternative (optional)</label><input id="alt" value="${esc(x.alt)}"><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="report(${id})">Report</button></div>`)}function report(id){if(!mode||s.shopper!==s.user)return;let x=item(id);x.status='unavailable';x.alt=document.querySelector('#alt').value.trim();notice(s.user+' reported '+x.name+' unavailable');closeModal();save()}function retry(id){if(!mode||s.shopper!==s.user)return;item(id).status='pending';notice(s.user+' returned '+item(id).name+' to the list');closeModal();save()}function removeItem(id){if(mode||item(id)?.status==='purchased')return;popup(`<h2>Remove ${esc(item(id).name)}?</h2><p>This removes the request for everyone.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmRemove(${id})">Remove</button></div>`)}function confirmRemove(id){if(mode||item(id)?.status==='purchased')return;notice(s.user+' removed '+item(id).name);s.items=s.items.filter(x=>x.id!==id);closeModal();save()}function start(){if(s.shopper)return;s.shopper=s.user;mode=true;notice(s.user+' started shopping');save()}function toggleMode(){if(s.shopper!==s.user)return;mode=!mode;render()}function finish(){if(!mode||s.shopper!==s.user)return;popup(`<h2>Finish shopping?</h2><p>Purchased items move to history. Pending and unavailable items stay on the list.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="complete()">Finish</button></div>`)}function complete(){if(!mode||s.shopper!==s.user)return;s.history.unshift(...s.items.filter(x=>x.status==='purchased').map(x=>({...x,date:new Date(x.purchasedAt||Date.now()).toLocaleString()})));s.items=s.items.filter(x=>x.status!=='purchased');s.shopper=null;mode=false;notice(s.user+' finished shopping');closeModal();save()}function again(i){draft={...s.history[i],id:uid(),by:s.user,status:'pending',buyer:undefined,date:undefined};checkDuplicate()}function authGo(p){authPage=p;render()}
function renderAuth(){let body='';const back='<button onclick="authGo(\'welcome\')">← Back</button>';if(account){if(authPage==='createFamily'){body=`<button onclick="authGo('setup')">← Back</button><h1>Create a family</h1><form onsubmit="createFamily(event)"><label for="familyName">Family name</label><input id="familyName" required maxlength="60" placeholder="Our household"><button class="primary wide">Create family</button></form>`}else if(authPage==='join'){body=`<button onclick="authGo('setup')">← Back</button><h1>Join your family</h1><p>Enter the invitation code shared by a family member.</p><form onsubmit="findFamily(event)"><label for="code">Invitation code</label><input id="code" required inputmode="numeric" maxlength="7" placeholder="6-digit code"><p id="error" role="alert"></p><button class="primary wide">Continue</button></form><p class="muted">Don't have a code? Ask a family member to invite you.</p>`}else if(authPage==='confirm'&&db.families[joinId]){let f=db.families[joinId];body=`<button onclick="authGo('join')">← Back</button><h1>${esc(f.name)}</h1><p>${f.members.length} family members</p><div class="panel">${f.members.map(esc).join(', ')}</div><p>Join this family and access its shared shopping list?</p><button class="primary wide" onclick="joinFamily()">Join family</button>`}else{body=`<h1>Set up your family</h1><p>Welcome, ${esc(account.name)}. How would you like to get started?</p><button class="primary wide" onclick="authGo('createFamily')">Create a family</button><button class="wide" onclick="authGo('join')">Join a family</button><button class="wide" onclick="logout()">Log out</button>`}}else if(authPage==='login'||authPage==='register'){let reg=authPage==='register';body=`${back}<h1>${reg?'Create your account':'Log in'}</h1><form onsubmit="authenticate(event,${reg})">${reg?'<label for="fullName">Full name</label><input id="fullName" required maxlength="40" autocomplete="name">':''}<label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="${reg?'new-password':'current-password'}">${reg?'<label for="confirmPassword">Confirm password</label><input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password">':''}<p id="error" role="alert"></p><button class="primary wide">${reg?'Create account':'Log in'}</button></form>${reg?'':'<div class="panel"><small>Demo accounts: mohammed@demo.com, heba@demo.com, youssof@demo.com / demo123</small><button class="wide" onclick="demoLogin()">Log in as demo user</button></div>'}`}else{body=`<div style="text-align:center;padding:65px 10px 30px"><div style="font-size:56px">🛒</div><h1>Family Shopping</h1><p>Plan together. Shop smarter.</p></div><button class="primary wide" onclick="authGo('register')">Create an account</button><button class="wide" onclick="authGo('login')">Log in</button><p class="muted" style="text-align:center">Interactive prototype · Shared data is saved in this browser when supported. Use Switch user to test collaboration on one device. Use fictional credentials only.</p><details class="panel"><summary>Prototype testing tools</summary><button class="danger wide" onclick="resetAll()">Reset prototype</button></details>`}app.innerHTML=testToolbar()+body}
function error(t){document.querySelector('#error').textContent=t}function demoLogin(){let a=db.accounts.find(a=>a.email==='mohammed@demo.com');if(!a){db=initial();a=db.accounts[0]}setSession(a.email);restore();authPage='setup';page='list';mode=false;filter='all';save()}function demoFill(){document.querySelector('#email').value='mohammed@demo.com';document.querySelector('#password').value='demo123'}function authenticate(e,reg){e.preventDefault();let email=document.querySelector('#email').value.trim().toLowerCase(),password=document.querySelector('#password').value;let a=db.accounts.find(a=>a.email===email);if(reg){if(password!==document.querySelector('#confirmPassword').value)return error('Passwords do not match.');if(a)return error('An account with this email already exists. Please log in.');let name=document.querySelector('#fullName').value.trim();if(!name)return error('Enter your name.');a={name,email,password,family:null};db.accounts.push(a)}else if(!a||a.password!==password)return error('Incorrect email or password.');setSession(a.email);restore();authPage='setup';page='list';mode=false;filter='all';save()}
function createFamily(e){e.preventDefault();let name=document.querySelector('#familyName').value.trim();if(!name)return;let id=String(uid()),code;do{code=String(Math.floor(100000+Math.random()*900000))}while(Object.values(db.families).some(f=>f.code===code));db.families[id]={name,code,admin:account.email,catalog:popular(),members:[],items:[],history:[],alerts:[],shopper:null};joinId=id;joinFamily()}
function findFamily(e){e.preventDefault();let code=document.querySelector('#code').value.replace(/\s/g,'');joinId=Object.keys(db.families).find(k=>db.families[k].code===code);if(!joinId)return error('Invitation code not found. Check the code and try again.');authGo('confirm')}
function joinFamily(){if(!account||account.family||!db.families[joinId])return;let f=db.families[joinId];if(f.members.includes(account.name)){let base=account.name,i=2;while(f.members.includes(account.name))account.name=base+' ('+i+++')'}account.family=joinId;f.members.push(account.name);restore();page='list';notice(account.name+' joined the family');save()}
function logout(){setSession(null);restore();authPage='welcome';page='list';mode=false;filter='all';save()}
function testToolbar(){return `<div class="test-toolbar"><div><small>Prototype testing</small><br><strong>${esc(account?.name||'Logged out')}</strong></div><button class="test-switch" onclick="switchMemberDialog()">Switch user ▾</button></div>`}
function switchMemberDialog(){popup(`<h2>Test as another user</h2><p class="muted">Prototype testing only. Shared family data is preserved.</p>${db.accounts.map((a,i)=>`<button class="wide" onclick="testSwitch(${i})">${esc(a.name)} · ${a.family?(db.families[a.family]?.admin===a.email?'Admin':'Member'):'No family'}${a===account?' ✓':''}</button>`).join('')}<button class="wide" onclick="testSwitch(-1)">＋ Start as a new user</button><button class="wide" onclick="closeModal()">Cancel</button>`)}
function testSwitch(i){const target=db.accounts[i];if(i!==-1&&!target)return;setSession(target?.email||null);restore();closeModal();authPage=account?'setup':'welcome';joinId=null;page='list';mode=!!s&&s.shopper===s.user;filter='all';render();window.scrollTo(0,0)}
function deleteFamily(){if(account.email!==s.admin)return;popup(`<h2>Delete this family?</h2><p>This permanently removes the shared list, product catalog, history and activity for all members. Personal accounts will remain and members can create or join another family.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmDeleteFamily()">Delete family</button></div>`)}
function confirmDeleteFamily(){if(account.email!==s.admin)return;let id=account.family;db.accounts.filter(a=>a.family===id).forEach(a=>a.family=null);delete db.families[id];restore();closeModal();authPage="setup";page="list";mode=false;save()}
function leaveFamily(){if(account.email===s.admin)return;popup('<h2>Leave this family?</h2><p>You will lose access to its shared list and history.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmLeave()">Leave family</button></div>')}
function confirmLeave(){if(account.email===s.admin)return;let id=account.family;notice(account.name+' left the family');s.members=s.members.filter(m=>m!==account.name);if(s.shopper===account.name)s.shopper=null;if(!s.members.length)delete db.families[id];account.family=null;restore();closeModal();authPage='setup';save()}
async function copyCode(){try{await navigator.clipboard.writeText(s.code);alert('Invitation code copied.')}catch{prompt('Copy this invitation code:',s.code)}}function resetAll(){if(confirm('Reset all prototype accounts and shopping data?')){db=initial();setSession(null);restore();authPage='welcome';page='list';mode=false;filter='all';save(true)}}

function preferencesForm(x,alt=false){return `<label for="pref-brand">Brand (optional)</label><input id="pref-brand" value="${esc(x.prefs?.brand)}" maxlength="100"><label for="countrySearch">Country of origin (optional)</label><div class="country-combo"><div class="row"><input id="countrySearch" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="countryResults" placeholder="No preference" value="${esc(x.prefs?.origin)}" oninput="showCountries()" onkeydown="countryKey(event)" onclick="showCountries(true)"><button type="button" aria-label="Show countries" onclick="showCountries(true)">▾</button></div><input type="hidden" id="pref-origin" value="${esc(x.prefs?.origin)}"><div id="countryResults" class="product-results" hidden role="listbox"></div></div>`}
function showCountries(all=false){let i=document.querySelector('#countrySearch'),r=document.querySelector('#countryResults');if(!all)document.querySelector('#pref-origin').value='';let q=all?'':i.value.toLowerCase();let priority=['Qatar','Saudi Arabia','United Arab Emirates','Oman','India'];let ordered=[...priority,...countryNames.filter(n=>!priority.includes(n))];r.innerHTML=[['','No preference'],...ordered.filter(n=>n.toLowerCase().includes(q)).map(n=>[n,n])].map(([v,l])=>`<button type="button" role="option" data-country="${esc(v)}" onclick="chooseCountry(this.dataset.country)">${esc(l)}</button>`).join('');r.hidden=false;i.setAttribute('aria-expanded','true')}
function chooseCountry(v){document.querySelector('#countrySearch').setCustomValidity('');document.querySelector('#countrySearch').value=v;document.querySelector('#pref-origin').value=v;hideCountries()}
function hideCountries(){let r=document.querySelector('#countryResults'),i=document.querySelector('#countrySearch');if(r)r.hidden=true;if(i)i.setAttribute('aria-expanded','false')}
function countryKey(e){let r=document.querySelector('#countryResults');if(e.key==='Escape'){e.stopPropagation();hideCountries()}if(e.key==='ArrowDown'){e.preventDefault();if(r.hidden)showCountries(true);r.querySelector('button')?.focus()}if(e.key==='Enter'&&!r.hidden){e.preventDefault();let exact=countryNames.find(n=>n.toLowerCase()===e.target.value.toLowerCase());if(exact)chooseCountry(exact)}}
document.addEventListener('click',e=>{if(!e.target.closest('.country-combo'))hideCountries()});
function validCountry(){let i=document.querySelector("#countrySearch");if(i.value.trim()&&!countryNames.some(n=>n.toLowerCase()===i.value.trim().toLowerCase())){i.setCustomValidity("Choose a country from the list or clear the field.");i.reportValidity();i.oninput=()=>{i.setCustomValidity("");showCountries()};return false}return true}
function readPrefs(){let i=document.querySelector('#countrySearch');let origin=countryNames.find(n=>n.toLowerCase()===i.value.trim().toLowerCase())||'';return {brand:document.querySelector('#pref-brand').value.trim(),origin}}
function prefsEqual(a,b){return prefFields.every(([k])=>(a.prefs?.[k]||'').toLowerCase()===(b.prefs?.[k]||'').toLowerCase())&&(a.note||'')===(b.note||'')}
function canShop(){return mode&&s&&s.shopper===s.user}
function owns(x){return x.requester?x.requester===account.email:x.by===s.user}
function proposalView(x){let p=x.proposal;if(!p)return '';return `<div class="panel"><strong>${esc({waiting:'Awaiting approval',approved:'Alternative approved',declined:'Alternative declined',allowed:'Alternative selected'}[p.state])}</strong><p>Proposed: ${esc(p.name)} · ${p.qty} ${esc(p.unit)}<br>${esc(prefText(p))}</p><small>${esc(p.reason)}</small>${!mode&&owns(x)&&p.state==='waiting'?`<div class="actions"><button class="primary" onclick="respond(${x.id},true)">Accept</button><button onclick="respond(${x.id},false)">Reject</button></div>`:''}${canShop()&&x.status!=='purchased'&&['waiting','approved','allowed'].includes(p.state)?`<button class="wide" onclick="cancelAlternative(${x.id})">Cancel alternative</button>`:''}</div>`}
function alternative(id){let x=item(id);if(!canShop()||!x||x.status==='purchased')return;let a=x.proposal||x;popup(`<h2>Suggest alternative</h2><div class="panel"><strong>Original item</strong><p>${esc(x.name)} · ${x.qty} ${esc(x.unit)}<br>${esc(prefText(x))}</p></div><form onsubmit="sendAlternative(event,${id})"><label for="altName">Product</label><input id="altName" required value="${esc(a.name)}"><label for="altQty">Quantity</label><div class="qty-stepper"><button type="button" aria-label="Decrease quantity" onclick="stepQty('altQty',-1)">−</button><input id="altQty" type="number" min="0.01" step="any" required value="${a.qty}"><button type="button" aria-label="Increase quantity" onclick="stepQty('altQty',1)">+</button></div><label for="altUnit">Unit</label><select id="altUnit">${['piece','pack','litre','kg','bottle','box','g'].map(u=>`<option ${u===a.unit?'selected':''}>${u}</option>`).join('')}</select>${preferencesForm(a,true)}<label for="altReason">Reason / shopper notes</label><textarea id="altReason">${esc(a.reason||'')}</textarea><div class="actions"><button type="button" onclick="closeModal()">Cancel</button><button class="primary">Send suggestion</button></div></form>`)}
function sendAlternative(e,id){e.preventDefault();if(!validCountry())return;let x=item(id);if(!canShop()||!x||x.status==='purchased')return;let name=document.querySelector('#altName').value.trim();if(!name)return;x.proposal={name,qty:Number(document.querySelector('#altQty').value),unit:document.querySelector('#altUnit').value,prefs:readPrefs(),reason:document.querySelector('#altReason').value.trim(),state:owns(x)?'approved':'waiting',shopper:s.user};x.status='pending';notice(s.user+' suggested '+name+' as an alternative for '+x.name);closeModal();save()}
function respond(id,accept){let x=item(id);if(!x||!owns(x)||x.proposal?.state!=='waiting')return;x.proposal.state=accept?'approved':'declined';notice(s.user+(accept?' approved':' declined')+' alternative for '+x.name);save()}
function cancelAlternative(id){let x=item(id);if(!canShop()||!x||x.status==='purchased')return;delete x.proposal;notice(s.user+' cancelled alternative for '+x.name);save()}
function toggle(id){let x=item(id);if(!canShop()||!x||x.proposal?.state==='waiting')return;if(x.status==='purchased'){x.status='pending';delete x.buyer;delete x.purchasedAt;delete x.actual}else{if(x.proposal?.state==='declined'){alert('Cancel the declined suggestion or propose another alternative first.');return}x.status='purchased';x.buyer=s.user;x.purchasedAt=new Date().toISOString();if(['approved','allowed'].includes(x.proposal?.state))x.actual=JSON.parse(JSON.stringify(x.proposal))}notice(s.user+' marked '+x.name+' as '+x.status);save()}
function unavailable(id){let x=item(id);if(!canShop()||!x||x.status==='purchased')return;popup(`<h2>Report unavailable</h2><p>${esc(x.name)} will remain on the list.</p><div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="report(${id})">Report</button></div>`)}
function report(id){let x=item(id);if(!canShop()||!x||x.status==='purchased')return;x.status='unavailable';delete x.proposal;notice(s.user+' reported '+x.name+' unavailable');closeModal();save()}
function finish(){if(!canShop())return;let count=t=>s.items.filter(x=>x.status===t).length;popup(`<h2>Shopping summary</h2><p>Purchased: ${count('purchased')} · Unavailable: ${count('unavailable')} · Pending: ${count('pending')}</p><p>Purchased with alternatives: ${s.items.filter(x=>x.actual&&x.status==='purchased').length}</p><p>Unpurchased items remain on the list. Unresolved suggestions will close.</p><div class="actions"><button onclick="closeModal()">Continue shopping</button><button class="primary" onclick="complete()">Confirm &amp; finish</button></div>`)}
function complete(){if(!canShop())return;s.history.unshift(...s.items.filter(x=>x.status==='purchased').map(x=>({...x,date:new Date(x.purchasedAt||Date.now()).toLocaleString()})));s.items=s.items.filter(x=>x.status!=='purchased');s.items.forEach(x=>delete x.proposal);s.shopper=null;mode=false;notice(s.user+' finished shopping');closeModal();save()}
function again(i){let x=s.history[i];if(!x)return;draft={name:(x.actual||x).name,productId:s.catalog.find(p=>p.name.toLowerCase()===(x.actual||x).name.toLowerCase())?.id,qty:(x.actual||x).qty,unit:(x.actual||x).unit,note:x.note,prefs:{...(x.actual||x).prefs},requester:account.email,by:s.user,status:'pending',id:uid()};checkDuplicate()}

function stepQty(id,delta){const el=document.getElementById(id);if(!el)return;const min=Number(el.min)||0.01,max=Number(el.max)||9999;const curr=Number(el.value)||min;el.value=String(Math.min(max,Math.max(min,Math.round((curr+delta)*1000000)/1000000)));el.dispatchEvent(new Event('input',{bubbles:true}));}</script></html>
